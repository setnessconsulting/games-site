name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show canonical formatter output
        run: |
          npx prettier --write src/components/WebglGameFrame.astro src/lib/catalog.ts src/pages/number-line-jumper/play.astro
          git diff -- src/components/WebglGameFrame.astro src/lib/catalog.ts src/pages/number-line-jumper/play.astro

      - name: Generate Cloudflare types
        run: npm run types:wrangler

      - name: Verify site
        run: npm run verify

      - name: Verify Cloudflare configuration
        run: npm run check:wrangler
